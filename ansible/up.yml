---
- name: Bring up the lab from scenario.yml
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ playbook_dir }}/../.venv/bin/python"
    lab_network: lab
    egress_network: egress
    scenario_path: "{{ playbook_dir }}/../scenario.yml"
    stage_root: /tmp/demo-eval-harness-lab
  tasks:
    - name: Load scenario.yml
      ansible.builtin.include_vars:
        file: "{{ scenario_path }}"
        name: scenario

    - name: Ensure the lab Docker network exists
      # internal: Docker drops egress from this network, so lab hosts cannot reach
      # the internet. Only the runner is dual-homed onto egress.
      community.docker.docker_network:
        name: "{{ lab_network }}"
        internal: true
        state: present

    - name: Ensure the egress Docker network exists
      # Gives the runner a route to the model API while it is attached to the
      # isolated lab network. No lab host is ever joined to this network.
      community.docker.docker_network:
        name: "{{ egress_network }}"
        state: present

    - name: Clear staging root
      ansible.builtin.file:
        path: "{{ stage_root }}"
        state: absent

    - name: Create staging root
      ansible.builtin.file:
        path: "{{ stage_root }}"
        state: directory
        mode: "0755"

    - name: Stage each host build directory
      ansible.builtin.file:
        path: "{{ stage_root }}/{{ item.name }}"
        state: directory
        mode: "0755"
      loop: "{{ scenario.hosts }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Copy each host app into its stage
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item.app }}/"
        dest: "{{ stage_root }}/{{ item.name }}/"
        mode: "0644"
      loop: "{{ scenario.hosts }}"
      loop_control:
        label: "{{ item.name }}/{{ item.app }}"

    - name: Build an image for each host
      community.docker.docker_image:
        name: "demo-eval-harness-{{ item.name }}"
        source: build
        build:
          path: "{{ stage_root }}/{{ item.name }}"
        state: present
        force_source: true
      loop: "{{ scenario.hosts }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Ensure each host container is running
      community.docker.docker_container:
        name: "{{ item.name }}"
        image: "demo-eval-harness-{{ item.name }}"
        state: started
        restart_policy: "no"
        networks:
          - name: "{{ lab_network }}"
        networks_cli_compatible: true
        comparisons:
          networks: strict
          image: strict
      loop: "{{ scenario.hosts }}"
      loop_control:
        label: "{{ item.name }}"
