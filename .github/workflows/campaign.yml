name: campaign

on:
  push:
  pull_request:

jobs:
  test-and-campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements-host.txt
          ansible-galaxy collection install community.docker

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Campaign or skip
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::warning::GROQ_API_KEY is not set; skipping the campaign. Add the repository secret to run trials against Groq."
            exit 0
          fi
          python -m harness.runner --model "$GROQ_MODEL"

      - name: Upload campaign.json
        if: hashFiles('campaign.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: campaign-json
          path: campaign.json
          if-no-files-found: ignore
